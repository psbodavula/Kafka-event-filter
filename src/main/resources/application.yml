server:
  port: 8080

spring:
  application:
    name: kafka-event-filter
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/event_filter_db}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: event-filter-group
      auto-offset-reset: earliest
    producer:
      acks: all
      retries: 3

kafka:
  topic-pattern: ${KAFKA_TOPIC_PATTERN:events.*}

# SWIFT GPI Tracker API Configuration
swift:
  api:
    base-url: ${SWIFT_API_BASE_URL:https://sandbox.swift.com}
    tracker-path: /swift-apitracker/v5
    api-key: ${SWIFT_API_KEY:}
    client-id: ${SWIFT_CLIENT_ID:}
    client-secret: ${SWIFT_CLIENT_SECRET:}
    institution-bic: ${SWIFT_INSTITUTION_BIC:}
    connect-timeout: 10000
    read-timeout: 30000
    enabled: ${SWIFT_API_ENABLED:false}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.eventfilter: DEBUG
    org.apache.kafka: WARN
